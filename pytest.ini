[pytest]
# Pytest Configuration for BookScraper

# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and Reporting
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    --import-mode=importlib

# Coverage Settings (requires pytest-cov to be installed)
# Uncomment the lines below after installing: pip install pytest-cov
# --cov=src
# --cov-report=term-missing
# --cov-report=html:htmlcov
# --cov-report=xml
# --cov-fail-under=85

[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Test Markers
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - tests that integrate multiple components
    slow: Slow running tests
    network: Tests that require network access
    parser: Tests for HTML parsing functionality
    scraper: Tests for web scraping functionality
    cli: Tests for CLI commands
    utils: Tests for utility functions
    models: Tests for data models
    download: Tests for download functionality

# Asyncio Settings (requires pytest-asyncio to be installed)
# asyncio_mode = auto

# Timeout Settings (requires pytest-timeout to be installed)
# timeout = 300
# timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = False
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Console Output
console_output_style = progress

# Minimum Python Version
minversion = 3.8
